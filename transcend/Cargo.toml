[package]
name = "transcend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-web-actors = "4"
actix-multipart = "0.7.2"
actix-files = "0.6"
actix = "0.13.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.16", features = ["derive"] }
argon2 = "0.5"
password-hash = "0.5"
rand_core = "0.6"
bcrypt = "0.15"
jsonwebtoken = "9"
dotenvy = "0.15"
futures-util = "0.3.31"
sanitize-filename = "0.6.0"
bytes = "1.11.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# OpenAPI (Paperclip)
paperclip = { version = "0.5", features = ["actix"] }
paperclip-actix = { version = "0.5" }

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros"
] }

# Errors
thiserror = "1.0"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.24", features = ["webp"] }
webp = "0.2"
rayon = "1.8"
log = "0.4.29"
